<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/random github taker/style.css">
</head>
<body>
    <header id="header">
        <a href="https://github.com" style="color: orange;">Rep<img src="/random github taker/images/github-logo.png" alt=""> </a>
        <p>Fetcher</p>
    

    </header>
    <main>
        
            <a id="repoNameText" style="padding-bottom: 10px;"></a>

        <div id="container1">

            <div id="container2">
                <p id="repoCreator" >Creator:</p>
                <hr>
                <p>Repo description:</p>
                <p id="repoDescription" style="font-size: small;"></p>
            </div>

             <div id="container3">
                <p >Star count: <br> <p id="starCounts"></p> </p>
                <hr>
                <p style="font-size: smaller;">Number of forks: <br> <p id="forkCounts"></p> </p>
                <hr>
                <p>Open issues: <br> <p id="openIssuesCount"></p> </p>
             </div>

        </div>

    </main>

    <h2 id="loading">Loading</h2>
    <div id="inputs">

        <div>
            <input type="text" placeholder="Enter language" list="language" id="userProgramLanguage">
            <button type="submit" id="submit">Submit</button>
        </div>
        <datalist id="language"></datalist>
    </div>
    

    <script src="/random github taker/script.js"></script>
</body>
</html>
